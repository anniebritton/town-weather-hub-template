name: Deploy to GitHub Pages

# Publishes the static site. Requires Settings > Pages > Source: "GitHub Actions".
#
# In the upstream template repository this deploys the Southport example config so the live demo shows
# a real town. In ANY OTHER repository (your copy of the template) it deploys your own town.json, so
# your site can never show another town's phone numbers. Nothing here needs editing for that.
#
# Before your first push: enable Settings > Pages > Source "GitHub Actions". Until you do, the deploy
# step fails and the run shows a red X (nothing is broken; enable Pages and re-run it).
#
# It also runs after the "Refresh outage data" workflow (a push made with GITHUB_TOKEN does not
# trigger other workflows, so that workflow starts this one explicitly).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  UPSTREAM_TEMPLATE: anniebritton/town-weather-hub-template

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html fridge-card.html app.js town-utils.js pests.js styles.css town.json _site/
          cp -r assets data _site/

      - name: Use the Southport example (upstream demo only)
        if: github.repository == env.UPSTREAM_TEMPLATE
        run: cp examples/southport/town.json _site/town.json

      - name: Warn about unfinished town.json (your own site)
        if: github.repository != env.UPSTREAM_TEMPLATE
        continue-on-error: true
        run: |
          # Does not block the deploy; shows up as annotations on the run. Blank lines are dropped so
          # no empty annotations are created.
          node scripts/check-config.js | sed '/^[[:space:]]*$/d; s/^/::warning::/' | head -50 || true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
