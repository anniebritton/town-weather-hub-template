name: Deploy demo to GitHub Pages

# Publishes the static site with the Southport example config, so the live demo shows a real town
# while town.json in the repo stays generic. Requires Settings > Pages > Source: "GitHub Actions".
# If you fork this template for your own town, delete the "Use the Southport example" step so your
# own town.json is deployed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v6

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html fridge-card.html app.js pests.js styles.css town.json _site/
          cp -r assets _site/
          # data/outages.json in the repo is a fictional sample, so the demo leaves it out; the
          # page then shows its "outage data unavailable" state with working utility links.

      - name: Use the Southport example (demo only)
        run: cp examples/southport/town.json _site/town.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
