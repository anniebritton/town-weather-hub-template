name: Tests

# Every test mocks the network, so no secrets or internet access to NWS/NOAA are needed.

on:
  pull_request:
  push:
    branches: [main] # bot commits made with GITHUB_TOKEN don't trigger workflows, so only human pushes land here
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
